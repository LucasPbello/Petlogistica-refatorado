
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Editar Tutor | PETCARGO</title>

        <link rel="stylesheet"
              th:href="@{/css/estilo.css}">
    </head>

    <body class="painel-page">

        <header class="painel-cabecalho">
            <div class="painel-cabecalho-conteudo">

                <a th:href="@{/admin}" class="painel-logo">
                    🐾 PETCARGO
                </a>

                <a th:href="@{/admin/tutores}"
                   class="botao botao-secundario botao-pequeno">
                    ← Voltar aos tutores
                </a>

            </div>
        </header>

        <main class="painel-container">

            <section class="painel-boas-vindas">
                <span class="painel-etiqueta">
                    ÁREA ADMINISTRATIVA
                </span>

                <h1>Editar Tutor</h1>

                <p>
                    Atualize as informações cadastrais
                    do tutor selecionado.
                </p>
            </section>

            <!-- MENSAGENS -->

            <div th:if="${erro}"
                 class="mensagem-erro"
                 th:text="${erro}">
            </div>

            <div th:if="${sucesso}"
                 class="mensagem-sucesso"
                 th:text="${sucesso}">
            </div>

            <!-- FORMULÁRIO -->

            <section class="animal-form-card">

                <form th:action="@{/admin/tutores/{id}/editar(id=${tutor.idCliente})}"
                      th:object="${tutor}"
                      method="post">

                    <input type="hidden" th:field="*{idCliente}">

                    <div class="admin-tutor-form-grid">

                        <div class="admin-tutor-campo">
                            <label for="nome">Nome completo</label>

                            <input type="text"
                                   id="nome"
                                   th:field="*{nome}"
                                   autocomplete="name"
                                   maxlength="150"
                                   required>
                        </div>

                        <div class="admin-tutor-campo">
                            <label for="email">E-mail</label>

                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   autocomplete="email"
                                   required>
                        </div>


                        <div class="admin-tutor-campo">
                            <label for="cpf">CPF</label>

                            <input type="text"
                                   id="cpf"
                                   th:field="*{cpf}"
                                   data-mascara="cpf"
                                   inputmode="numeric"
                                   autocomplete="off"
                                   maxlength="14"
                                   placeholder="000.000.000-00">
                        </div>



                        <div class="admin-tutor-campo">
                            <label for="telefone">Telefone</label>

                            <input type="tel"
                                   id="telefone"
                                   th:field="*{telefone}"
                                   data-mascara="telefone"
                                   inputmode="numeric"
                                   autocomplete="tel"
                                   maxlength="15"
                                   placeholder="(00) 00000-0000">
                        </div>


                    </div>

                    <div class="animal-form-acoes">

                        <button type="submit" class="botao">
                            Salvar alterações
                        </button>

                        <a th:href="@{/admin/tutores}"
                           class="botao botao-secundario">
                            Cancelar
                        </a>

                    </div>

                </form>

            </section>

        </main>
        
        <script th:src="@{/js/app.js}" defer></script>
        
    </body>
</html>
