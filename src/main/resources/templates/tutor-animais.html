
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Meus Pets | PETCARGO</title>
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>

    <body class="painel-page">

        <header class="painel-cabecalho">
            <div class="painel-cabecalho-conteudo">
                <a th:href="@{/tutor}" class="painel-logo">
                    PETCARGO
                </a>
            </div>
        </header>

        <main class="painel-container">

            <section class="painel-boas-vindas">
                <p class="painel-etiqueta">ÁREA DO TUTOR</p>
                <h1>Meus pets</h1>
                <p>Gerencie seus pets, documentos e fotos.</p>
            </section>

            <div class="animais-acoes">
                <a th:href="@{/tutor/animais/novo}"
                   class="botao">
                    + Cadastrar pet
                </a>

                <a th:href="@{/tutor}">
                    Voltar ao painel
                </a>
            </div>

            <p th:if="${sucesso}"
               th:text="${sucesso}"
               class="mensagem-sucesso"></p>

            <p th:if="${erro}"
               th:text="${erro}"
               class="mensagem-erro"></p>

            <section class="animais-listagem">

                <h2>Pets cadastrados</h2>

                <p th:if="${#lists.isEmpty(animais)}">
                    Você ainda não cadastrou nenhum pet.
                </p>

                <div class="animais-grid"
                     th:unless="${#lists.isEmpty(animais)}">

                    <article class="animal-card"
                             th:each="animal : ${animais}">

                        <div class="animal-card-topo">
                            <div>
                                <span class="animal-card-etiqueta">
                                    PET CADASTRADO
                                </span>

                                <h3 th:text="${animal.nome}">
                                    Nome do pet
                                </h3>

                                <p th:text="|${animal.especie} • ${animal.raca}|">
                                    Espécie e raça
                                </p>
                            </div>

                            <span class="animal-card-icone">🐾</span>
                        </div>

                        <div class="animal-card-dados">
                            <p>
                                <strong>Sexo:</strong>
                                <span th:text="${animal.sexo}"></span>
                            </p>

                            <p>
                                <strong>Cor:</strong>
                                <span th:text="${animal.cor}"></span>
                            </p>

                            <p>
                                <strong>Peso:</strong>
                                <span th:text="|${animal.peso} kg|"></span>
                            </p>

                            <p>
                                <strong>Nascimento:</strong>
                                <span th:text="${animal.dataNascimento}"></span>
                            </p>
                        </div>

                        <div class="animal-card-acoes">

                            <a class="acao-editar"
                               th:href="@{/tutor/animais/{id}/editar(
                               id=${animal.idAnimal})}">
                                Editar
                            </a>

                            <a class="acao-arquivos"
                               th:href="@{/tutor/animais/{id}/arquivos(
                               id=${animal.idAnimal})}">
                                Documentos e fotos
                            </a>

                            <form method="post"
                                  th:action="@{/tutor/animais/{id}/excluir(
                                  id=${animal.idAnimal})}">

                                <button type="submit"
                                        class="acao-excluir"
                                        onclick="return confirm('Excluir este pet e todos os seus arquivos?');">
                                    Excluir
                                </button>
                            </form>

                        </div>
                    </article>

                </div>
            </section>

        </main>
    </body>
</html>
