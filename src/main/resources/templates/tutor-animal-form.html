
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>PETs | PETCARGO</title>

        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>

    <body class="painel-page">

        <header class="painel-cabecalho">
            <div class="painel-cabecalho-conteudo">
                <a th:href="@{/tutor}" class="painel-logo">
                    PETCARGO
                </a>
            </div>
        </header>

        <main class="painel-container">

            <section class="painel-boas-vindas">
                <p class="painel-etiqueta">ÁREA DO TUTOR</p>

                <h1 th:text="${animal.idAnimal == null}
                    ? 'Cadastrar pet'
                    : 'Editar pet'">
                    Cadastrar pet
                </h1>

                <p>Preencha ou atualize os dados do seu pet.</p>
            </section>

            <p th:if="${erro}"
               th:text="${erro}"
               class="mensagem-erro"></p>

            <section class="animal-form-card">

                <form th:action="${animal.idAnimal == null}
                      ? @{/tutor/animais}
                      : @{/tutor/animais/{id}/editar(
                      id=${animal.idAnimal})}"
                      method="post">

                    <h2>Dados do pet</h2>

                    <label for="nome">Nome</label>
                    <input id="nome"
                           name="nome"
                           th:value="${animal.nome}"
                           maxlength="100"
                           required>

                    <label for="especie">Espécie</label>
                    <select id="especie" name="especie" required>
                        <option value="">Selecione</option>

                        <option value="Cachorro"
                                th:selected="${animal.especie == 'Cachorro'}">
                            Cachorro
                        </option>

                        <option value="Gato"
                                th:selected="${animal.especie == 'Gato'}">
                            Gato
                        </option>

                        <option value="Ave"
                                th:selected="${animal.especie == 'Ave'}">
                            Ave
                        </option>

                        <option value="Outro"
                                th:selected="${animal.especie == 'Outro'}">
                            Outro
                        </option>
                    </select>

                    <label for="raca">Raça</label>
                    <input id="raca"
                           name="raca"
                           th:value="${animal.raca}"
                           maxlength="100">

                    <label for="sexo">Sexo</label>
                    <select id="sexo" name="sexo" required>
                        <option value="">Selecione</option>

                        <option value="Macho"
                                th:selected="${animal.sexo == 'Macho'}">
                            Macho
                        </option>

                        <option value="Fêmea"
                                th:selected="${animal.sexo == 'Fêmea'}">
                            Fêmea
                        </option>
                    </select>

                    <label for="cor">Cor</label>
                    <input id="cor"
                           name="cor"
                           th:value="${animal.cor}"
                           maxlength="100">

                    <label for="peso">Peso (kg)</label>
                    <input id="peso"
                           name="peso"
                           type="number"
                           min="0.01"
                           step="0.01"
                           th:value="${animal.peso}"
                           required>

                    <label for="tamanho">Tamanho</label>
                    <input id="tamanho"
                           name="tamanho"
                           type="number"
                           min="0.01"
                           step="0.01"
                           th:value="${animal.tamanho}"
                           required>

                    <label for="dataNascimento">
                        Data de nascimento
                    </label>
                    <input id="dataNascimento"
                           name="dataNascimento"
                           type="date"
                           th:value="${animal.dataNascimento}"
                           required>

                    <div class="animal-form-acoes">
                        <button type="submit" class="botao"
                                th:text="${animal.idAnimal == null}
                                ? 'Cadastrar pet'
                                : 'Salvar alterações'">
                            Salvar
                        </button>

                        <a th:href="@{/tutor/animais}">
                            Cancelar
                        </a>
                    </div>
                </form>

                <div class="animal-form-navegacao">

                    <a th:if="${animal.idAnimal != null}"
                       class="botao botao-secundario"
                       th:href="@{/tutor/animais/{id}/arquivos(
                       id=${animal.idAnimal})}">
                        Documentos e fotos →
                    </a>

                    <a th:href="@{/tutor/animais}"
                       class="botao botao-secundario">
                        ← Voltar aos meus pets
                    </a>

                </div>

            </section>

        </main>
    </body>
</html>
