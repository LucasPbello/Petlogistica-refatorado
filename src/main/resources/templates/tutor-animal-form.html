<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastrar animal | PETCARGO</title>
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
        <header>
            <h1>PETCARGO</h1>
            <p>Cadastro de animal</p>
        </header>

        <main>
            <h2>Dados do animal</h2>

            <p th:if="${erro}" th:text="${erro}"></p>

            <form th:action="@{/tutor/animais}" method="post">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" required maxlength="100">

                <label for="especie">Espécie</label>
                <select id="especie" name="especie" required>
                    <option value="">Selecione</option>
                    <option value="Cachorro">Cachorro</option>
                    <option value="Gato">Gato</option>
                    <option value="Ave">Ave</option>
                    <option value="Outro">Outro</option>
                </select>

                <label for="raca">Raça</label>
                <input id="raca" name="raca" maxlength="100">

                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo" required>
                    <option value="">Selecione</option>
                    <option value="Macho">Macho</option>
                    <option value="Fêmea">Fêmea</option>
                </select>

                <label for="cor">Cor</label>
                <input id="cor" name="cor" maxlength="100">

                <label for="peso">Peso (kg)</label>
                <input id="peso" name="peso" type="number"
                       min="0.01" step="0.01" required>

                <label for="tamanho">Tamanho</label>
                <input id="tamanho" name="tamanho" type="number"
                       min="0.01" step="0.01" required>


                <label for="dataNascimento">Data de nascimento</label>
                <input id="dataNascimento" name="dataNascimento"
                       type="date" required>

                <button type="submit">Salvar animal</button>
            </form>

            <p>
                <a th:href="@{/tutor/animais}">Cancelar e voltar</a>
            </p>
        </main>
    </body>
</html>
