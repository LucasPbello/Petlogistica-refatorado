<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Área do Tutor | PETCARGO</title>
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
        <header>
            <h1>PETCARGO</h1>
            <p>Área do Tutor</p>
        </header>

        <main>
            <h2>Bem-vindo ao PETCARGO!</h2>
            <p>Aqui você poderá consultar seus dados e gerenciar seus animais.</p>

            <nav>
                <a th:href="@{/tutor/animais}">Meus animais</a>
                <a th:href="@{/tutor/dados}">Meus dados</a>
            </nav>

            <form th:action="@{/logout}" method="post">
                <button type="submit">Sair</button>
            </form>
        </main>
    </body>
</html>
